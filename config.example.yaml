port: ":9090"
enable_toon: false

# 禅道服务器时区。v1 的对象日期是 UTC，动作日期是本地时间，
# 不换算会让凌晨 0-8 点的记录落到前一天，跨月统计出错。默认 Asia/Shanghai。
timezone: "Asia/Shanghai"

telemetry:
  endpoint: ""
  insecure: true

servers:
  # 名字必须和实际环境一致：指向正式库就别叫 test。
  - name: zentao
    schema_url: "zentao-openapi.json 的完整路径"
    base_url: "https://您的禅道域名/biz/api.php/v1"
    # 跳过 OpenAPI 中标记 deprecated 的接口。随附的禅道文档用它标记
    # 12.3 v1 不支持的路由，开启后可少注册 12 个必然失败的工具。
    skip_deprecated: true
    # 注册 zentao_* 复合工具（查 Bug、AI 评分、问题分析、质量统计、个人工作量）。
    # 仅当上游确实是禅道时开启。
    zentao_extensions: true
    # 是否声明输出 schema，默认 true。禅道文档给每个列表接口内联了约 86 字段的
    # 对象 schema，实测占 tools/list 报文的 91.6%；设为 false 可把工具报文
    # 从约 808 KB 降到约 67 KB，完整 JSON 仍在文本内容里返回。
    publish_output_schema: false
    auth:
      failure_limit: 2
      failure_window: "10m"
      token_ttl: "24h"
      failure_ttl: "30m"
      max_cache_entries: 2048
      # 所有 MCP 请求及新登录分别限流；rate 单位为每秒，burst 为瞬时容量。
      request_rate: 60
      request_burst: 120
      ip_request_rate: 30
      ip_request_burst: 60
      login_rate: 4
      login_burst: 8
      ip_login_rate: 1
      ip_login_burst: 3
      # 直连部署留空；反代部署只填实际代理来源 CIDR，才信任 X-Real-IP。
      trusted_proxies: []
    # 历史问题检索（zentao_find_similar_bugs）。禅道 v1 没有任何文本检索接口，
    # 所以服务端自建一份内存倒排索引：启动时拉全量 Bug，之后按 refresh 周期刷新。
    # 实测 17,684 条 Bug：拉取约 50s、建索引约 2.4s、查询约 30ms。
    bug_index:
      enabled: true
      # 建索引用的服务账号。索引里装的是这个账号能看到的全部内容，
      # 因此查询结果永远不会直接取自索引：每条候选都会用【调用者自己的凭据】
      # 重新读一次，读不到的直接丢弃，只回报被过滤的数量。
      account: "索引服务账号"
      # 口令优先从环境变量读，避免落到配置文件里。配合项目目录下的 .env（权限 600）：
      #   echo 'ZENTAO_INDEX_PASSWORD=xxx' > .env && chmod 600 .env
      # 并在 docker-compose.yml 的 environment 下加一行：
      #   ZENTAO_INDEX_PASSWORD: ${ZENTAO_INDEX_PASSWORD}
      password_env: "ZENTAO_INDEX_PASSWORD"
      refresh: "6h"
      body_chars: 400
      # 这两个上限必须覆盖服务账号的实际可见范围；不足时日志和 index.partial 会提示截断。
      # 先确认账号能看到多少产品：GET /products?limit=1 的 total。
      max_products: 700
      max_bugs_per_product: 8000
    allow:
      - methods: ["GET", "POST", "PUT", "DELETE"]
        regex: ".*"
    # 正式环境建议禁用删除接口
    block:
      - methods: ["DELETE"]
        regex: ".*"
