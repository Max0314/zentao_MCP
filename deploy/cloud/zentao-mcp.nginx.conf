# 禅道 MCP —— 对外 https://neoflow-cn.neo-net.com/zentao-mcp/
#
# 部署位置：NeoFlow 主服务器（47.108.48.50）的 ~/.nginx/zentao-mcp.conf
#
# 本文件被主配置以 include /home/*/.nginx/*.conf 加载到 server{} 上下文里。
# 所有指令都必须写在 location 内部：写在文件顶层的 if / allow / deny / proxy_*
# 会作用到整个域名，连带影响其他人的服务。
# 改完必须请有权限的维护者执行 nginx -t —— 一个用户配错会让全局 nginx -t 失败。

location = /zentao-mcp {
    return 301 /zentao-mcp/;
}

location ^~ /zentao-mcp/ {
    # Go 服务在 MCP 初始化、工具列表和调用前验证禅道凭据，客户端只需
    # zentao-account / zentao-password（或有效 token），不再需要共享入口密钥。
    # 请求与首次登录均有按来源 IP 和全局的限流，另有按账号的失败冷却。

    # 关键：结尾不能有斜杠，也不能带路径。
    #
    # 维护说明里的标准模板是 proxy_pass http://HOST:PORT/; —— 结尾那个斜杠
    # 会剥掉 /zentao-mcp 前缀。对普通 Web 应用无所谓，对 MCP 是致命的：
    # SSE 通道握手后，服务端要推一个 endpoint 事件告诉客户端"接下来往哪 POST"，
    # 而这个地址是按 Go 服务自己看到的路径算出来的（go-sdk v1.0.0 mcp/sse.go:219
    # 的 req.URL.Parse + RequestURI）。前缀被剥掉之后它会回一个少了前缀的地址，
    # 客户端照着发就是 404，连接建立后立刻断。
    #
    # 所以子路径必须和 config.yaml 里的 server name 一字不差，且不做改写。
    proxy_pass http://127.0.0.1:39029;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE 长连接：必须关缓冲，否则事件流会被攒着不发；超时要比模板的 300s 长。
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    client_max_body_size 10m;

    # config.yaml 的 auth.trusted_proxies 只列 nginx 到容器的实际直连来源
    # （Docker bridge 网关 /32）。不要为了方便信任所有内网或所有来源。
    # X-Real-IP 必须像上面这样覆盖；Go 不信任非指定代理送来的此请求头。
}
