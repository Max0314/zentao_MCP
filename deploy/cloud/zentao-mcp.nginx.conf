# 禅道 MCP —— 对外 https://neoflow-cn.neo-net.com/zentao-mcp/
#
# 部署位置：NeoFlow 主服务器（47.108.48.50）的 ~/.nginx/zentao-mcp.conf
#
# 本文件被主配置以 include /home/*/.nginx/*.conf 加载到 server{} 上下文里。
# 所有指令都必须写在 location 内部：写在文件顶层的 if / allow / deny / proxy_*
# 会作用到整个域名，连带影响其他人的服务。
# 改完必须请有权限的维护者执行 nginx -t —— 一个用户配错会让全局 nginx -t 失败。

location = /zentao-mcp {
    return 301 /zentao-mcp/;
}

location ^~ /zentao-mcp/ {
    # 预共享 key，挡掉全网扫描。生成一串：openssl rand -hex 32
    # 客户端在原有的 zentao-account / zentao-password 之外多带一个
    # X-Mcp-Key 请求头即可。不想要这一层就把这三行删掉。
    if ($http_x_mcp_key != "PUT-A-RANDOM-KEY-HERE") {
        return 403;
    }

    # 关键：结尾不能有斜杠，也不能带路径。
    #
    # 维护说明里的标准模板是 proxy_pass http://HOST:PORT/; —— 结尾那个斜杠
    # 会剥掉 /zentao-mcp 前缀。对普通 Web 应用无所谓，对 MCP 是致命的：
    # SSE 通道握手后，服务端要推一个 endpoint 事件告诉客户端"接下来往哪 POST"，
    # 而这个地址是按 Go 服务自己看到的路径算出来的（go-sdk v1.0.0 mcp/sse.go:219
    # 的 req.URL.Parse + RequestURI）。前缀被剥掉之后它会回一个少了前缀的地址，
    # 客户端照着发就是 404，连接建立后立刻断。
    #
    # 所以子路径必须和 config.yaml 里的 server name 一字不差，且不做改写。
    proxy_pass http://127.0.0.1:39029;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE 长连接：必须关缓冲，否则事件流会被攒着不发；超时要比模板的 300s 长。
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    client_max_body_size 10m;

    # 按来源 IP 限速。千问办公没有固定出口 IP，白名单用不了，这是唯一替代。
    # 为什么需要：登录失败的退避是按「账号+密码」这一对组合算的（提交 f0e7043），
    # 换个密码就是新 key、立刻放行重试；而禅道按账号累计失败次数锁号。公网上
    # 没有限速，等于别人可以不停换密码把同事的禅道账号撞锁。
    #
    # limit_req_zone 是 http 段指令，本文件写不了。先请维护者在主配置的 http 段加：
    #     limit_req_zone $binary_remote_addr zone=mcp:10m rate=10r/s;
    # 加完之后再把下面这行取消注释。zone 没定义就取消注释会让全局 nginx -t 失败。
    # limit_req zone=mcp burst=20 nodelay;
}
